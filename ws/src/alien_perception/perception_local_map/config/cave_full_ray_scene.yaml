schema_version: 1

frames:
  map: map
  body: base_link
  scan: scan_link

topics:
  cave_truth: /cave/points
  odometry: /cave_scene/odom
  path: /cave_scene/path
  raw_scan: /cave_scene/raw_scan
  released_scan: /cave_scene/scan
  observations: /cave_scene/perception/observations
  pose: /cave_scene/perception/pose
  health: /cave_scene/perception/health
  local_map_state: /cave_scene/local_map/state
  local_map_octomap: /cave_scene/local_map/octomap

cave:
  mode: tree
  seed: 42
  base_radius_m: 2.5
  n_segments: 200
  density: 400
  noise_scale: 0.4
  tree:
    approach_length_m: 12.0
    loop_yaw_rad: 0.50
    loop_direct_length_m: 16.0
    loop_bulge_m: 12.0
    exit1_length_m: 14.0
    right_yaw_rad: -0.12
    right_corridor_length_m: 10.0
    exit_yaw_spread_rad: 0.35
    exit_arm_length_m: 14.0
    vertical_step_rad: -0.10
    asymmetry: 0.22
    chamber_on_approach: false
    chamber_at: 0.55
    chamber_scale: 2.2

trajectory:
  start_m: [1.0, 0.0, 1.5]
  end_m: [11.0, 0.0, 1.5]
  duration_s: 20.0
  odometry_rate_hz: 20.0
  motion_mode: line
  altitude_adapt: false

scan:
  beam_count: 360
  rate_hz: 10.0
  range_min_m: 0.1
  range_max_m: 30.0
  range_noise_std_m: 0.0
  noise_seed: 0
  body_from_scan_quaternion_xyzw: [0.5, 0.5, 0.5, 0.5]

timing:
  pose_lead_delay_s: 0.1
  pending_timeout_s: 1.0
  max_pending_scans: 64
  transport_drain_s: 0.5

sensor_contract:
  sensor_id: cave_scan
  sensor_type: 2d
  ray_evidence: full_ray
  requires_pose: true
  expected_pose_frame: map
  pose_source_id: odom
  clock_domain: vehicle_steady_clock
  pose_timeout_s: 1.0
  minimum_pose_quality: 0.0
  recovery_stability_samples: 3
  sensor_timeout_s: 0.5
  health_period_s: 0.2

map:
  vehicle_id: cave-scene-vehicle
  resolution_m: 0.2
  lattice_origin_m: [0.0, 0.0, 0.0]
  map_freshness_s: 1.0
  state_heartbeat_period_s: 0.2
